services:
  common:
    image: scratch
    user: root
    build:
      context: ./dockerfiles
    volumes:
      - ${PWD}:${PWD}
      - /etc/localtime:/etc/localtime:ro  # Sync container time with host time
    working_dir: ${PWD}
    tty: true
    pull_policy: never
    environment:
      - COLORTERM=truecolor
  bashls:
    image: bashls
    build:
      dockerfile: bashls/Dockerfile
    extends: common
  cabal:
    image: cabal
    build:
      dockerfile: cabal/Dockerfile
    volumes:
      - ${HOME}/.cache/cabal:/root/.cache/cabal
      - ${HOME}/.config/cabal:/root/.config/cabal
      - ${HOME}/.local/state/cabal:/root/.local/state/cabal
    extends: common
  clangd:
    image: lspcontainers/clangd-language-server
    extends: common
    pull_policy: missing
  cmake:
    image: cmake
    build:
      dockerfile: cmake/Dockerfile
    extends: common
  gcc:
    image: gcc:12.2
    extends: common
    pull_policy: missing
  gnuplot:
    image: gnuplot
    build:
      dockerfile: gnuplot/Dockerfile
    extends: common
  gemini-cli:
    build:
      dockerfile: gemini-cli/Dockerfile
    image: gemini-cli
    volumes:
      - ${HOME}/.config/gemini:/root/.gemini
    extends: common
  gh:
    build:
      dockerfile: gh/Dockerfile
    image: gh
    volumes:
      - ${HOME}/.config/gh:/root/.config/gh
    extends: common
  firefox:
    image: firefox:0.0
    build:
      dockerfile: firefox/Dockerfile
    extends: common
    environment:
      - DISPLAY=${DISPLAY}
      - GTK_IM_MODULE=xim
      - QT_IM_MODULE=${QT_IM_MODULE}
      - XMODIFIERS=${XMODIFIERS}
      - DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/bus
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - ${HOME}/.mozilla:/root/.mozilla
      - ${HOME}/.cache/mozilla:/root/.cache/mozilla
      - ${HOME}/.config/fcitx5:/root/.config/fcitx5:ro
      - ${HOME}/Downloads:/root/Downloads
      - /run/user/1000/bus:/run/user/bus
  gitlab-mcp:
    image: gitlab-mcp
    build:
      context: ./dockerfiles
      dockerfile: gitlab-mcp/Dockerfile
      args:
        - GITLAB_MCP_VERSION=2.1.42
    pull_policy: never
    user: root
    environment:
      - GITLAB_API_URL=${GITLAB_API_URL}
      - GITLAB_PERSONAL_ACCESS_TOKEN=${GITLAB_PERSONAL_ACCESS_TOKEN}
      - STREAMABLE_HTTP_AUTH_TOKEN=${STREAMABLE_HTTP_AUTH_TOKEN}
      - MCP_SERVER_URL=http://gitlab-mcp:3002
      - MCP_ALLOWED_HOSTS=gitlab-mcp,gitlab-mcp:3002
    restart: unless-stopped
  hermes-agent:
    image: hermes-agent:2026.7.20
    build:
      dockerfile: hermes-agent/Dockerfile
      args:
        - HERMES_AGENT_VERSION=2026.7.20
    depends_on:
      - gitlab-mcp
    environment:
      - STREAMABLE_HTTP_AUTH_TOKEN=${STREAMABLE_HTTP_AUTH_TOKEN}
      - GITHUB_PERSONAL_ACCESS_TOKEN=${GITHUB_PERSONAL_ACCESS_TOKEN}
    volumes:
      - type: bind
        source: ${HOME}/.agents
        target: ${DOCKER_HOME:-/root}/.agents
      - type: bind
        source: ${HOME}/.hermes
        target: ${DOCKER_HOME:-/root}/.hermes
    extends: common
  hls:
    image: hls
    build:
      dockerfile: hls/Dockerfile
    environment:
      - CABAL_DIR=${PWD}/.cabal
    extends: common
  lua_ls:
    image: lspcontainers/lua-language-server
    extends: common
    pull_policy: missing
  marksman:
    image: marksman:2026-02-08
    build:
      dockerfile: marksman/Dockerfile
      args:
        - MARKSMAN_VERSION=2026-02-08
  neovim:
    image: neovim:0.12.3
    build:
      dockerfile: neovim/Dockerfile
      args:
        - NEOVIM_VERSION=0.12.3
    volumes:
      - type: bind
        source: ${HOME}
        target: ${DOCKER_HOME:-/root}
      - type: bind
        source: ${HOME}
        target: ${HOME}
      - ${XDG_RUNTIME_DIR}/docker.sock:${XDG_RUNTIME_DIR}/docker.sock
    environment:
      - XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR}
      - DOCKER_CONTEXT=${DOCKER_CONTEXT}
    extends: common
  node-tsserver:
    image: node-tsserver
    build:
      dockerfile: node-tsserver/Dockerfile
    volumes:
      - ${HOME}:/root/
    extends: common
  opencode:
    image: opencode:1.18.5
    build:
      dockerfile: opencode/Dockerfile
      args:
        - OPENCODE_VERSION=1.18.5
    depends_on:
      - gitlab-mcp
    environment:
      - STREAMABLE_HTTP_AUTH_TOKEN=${STREAMABLE_HTTP_AUTH_TOKEN}
      - GITHUB_PERSONAL_ACCESS_TOKEN=${GITHUB_PERSONAL_ACCESS_TOKEN}
    extends: common
    ports:
      - 4966:4966
    volumes:
      - type: bind
        source: ${HOME}/.agents
        target: ${DOCKER_HOME:-/root}/.agents
      - type: bind
        source: ${HOME}/.cache/opencode
        target: ${DOCKER_HOME:-/root}/.cache/opencode
      - type: bind
        source: ${HOME}/.config/opencode
        target: ${DOCKER_HOME:-/root}/.config/opencode
      - type: bind
        source: ${HOME}/.local/share/opencode
        target: ${DOCKER_HOME:-/root}/.local/share/opencode
      - type: bind
        source: ${HOME}/.local/state/opencode
        target: ${DOCKER_HOME:-/root}/.local/state/opencode
  poetry:
    image: poetry
    build:
      dockerfile: poetry/Dockerfile
    environment:
      - POETRY_CACHE_DIR=${PWD}/.cache
    extends: common
  prettier:
    image: jauderho/prettier:3.8.3-alpine
    pull_policy: missing
    extends: common
  rust:
    image: rust:1.90.0-slim-bullseye
    environment:
      - CARGO_HOME=${PWD}/.cargo
    extends: common
    pull_policy: missing
  rye:
    image: rye
    build:
      dockerfile: rye/Dockerfile
    extends: common
    volumes:
      - ${HOME}/.cache:/root/.cache
  texlab:
    image: texlab
    build:
      dockerfile: texlab/Dockerfile
    extends: common
  uv:
    image: uv
    build:
      dockerfile: uv/Dockerfile
    environment:
      - UV_CACHE_DIR=${PWD}/.cache
      - UV_PYTHON_INSTALL_DIR=${PWD}/.python
    extends: common
  yamlls:
    image: quay.io/redhat-developer/yaml-language-server
    extends: common
    pull_policy: missing
